<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jesienne dekoracje 3D</title>
<style>
body {
 font-family: Arial, sans-serif;
 background: #f4f7f9;
 padding: 40px;
}
.gallery {
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
 gap: 20px;
}
.card {
 background: white;
 border-radius: 15px;
 overflow: hidden;
 box-shadow: 0 5px 15px rgba(0,0,0,.1);
}
.card img {
 width: 100%;
 height: 250px;
 object-fit: cover;
}
.info {
 padding: 20px;
}
.price {
 font-size: 24px;
 font-weight: bold;
 color: #0088cc;
}
.back-link {
 display: inline-block;
 margin-bottom: 20px;
 color: #0088cc;
 text-decoration: none;
 font-weight: bold;
}
</style>
</head>
<body>
<a href="../index.html" class="back-link">← Powrót do strony głównej</a>
<h1>🍂 Jesienne dekoracje 3D</h1>
<div class="gallery">
<div class="card">
<img src="../img/wazon1.jpg" alt="Wazon">
<div class="info">
<h3>Wazon</h3>
<div class="price">36 zł</div>
</div>
</div>
<div class="card">
<img src="../img/soon.jpg" alt="Dynia">
<div class="info">
<h3>Dynia</h3>
<div class="price">Wkrótce</div>
</div>
</div>
<div class="card">
<img src="../img/soon.jpg" alt="Dynia Modern">
<div class="info">
<h3>Dynia Modern</h3>
<div class="price">Wkrótce</div>
</div>
</div>
<div class="card">
<img src="../img/soon.jpg" alt="Grzybki">
<div class="info">
<h3>Grzybki</h3>
<div class="price">Wkrótce</div>
</div>
</div>
</div>
</body>
</html>
